# Razor — stack local completo.
#
#   docker compose up -d --build          banco + API + painel
#   docker compose --profile bot up -d    o mesmo, mais a Evolution API (gateway do WhatsApp)
#   docker compose logs -f backend        acompanhar o boot do Spring
#   docker compose down                   parar tudo (o banco sobrevive, e volume nomeado)
#   docker compose down -v                parar e APAGAR o banco
#
#   landing   http://localhost:8000   (site institucional, o que o visitante ve primeiro)
#   painel    http://localhost:3000   (o "Entrar" da landing leva para ca)
#   API       http://localhost:8081
#   postgres  localhost:5433
#
# Postgres, API e Evolution escutam so em 127.0.0.1: acessiveis desta maquina, invisiveis para
# a rede. O painel (3000) e a landing (8000) sao a porta de entrada publica — o painel ja
# encaminha /api para o backend pela rede interna do compose.
#
# Os segredos abaixo tem defaults de DESENVOLVIMENTO para o `up` funcionar sem .env. Em
# servidor, use o override de producao, que exige cada segredo e liga a validacao estrita:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# A Evolution fica fora por padrao porque so faz sentido quando voce vai parear um WhatsApp
# de verdade; sem ela o painel e a API funcionam inteiros.
#
# Variaveis: copie .env.docker.example para .env e ajuste. Sem .env o stack sobe com os
# defaults abaixo — IA desligada e telefone admin ficticio, o suficiente para mexer no painel.

name: razor

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barberbot_db}
      POSTGRES_USER: ${POSTGRES_USER:-barberbot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barberbot_pass}
    ports:
      # 5433 no host para nao brigar com um Postgres ja instalado na maquina.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # O backend so pode subir depois que o Postgres aceita conexao, senao o Flyway morre.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barberbot_user} -d ${POSTGRES_DB:-barberbot_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Dentro da rede do compose o banco atende em postgres:5432 (a porta 5433 e so no host).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-barberbot_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-barberbot_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-barberbot_pass}

      # Placeholder nao-vazio de proposito: o cliente da OpenAI recusa chave em branco no boot,
      # e o painel ja trata chave com "dummy" como IA nao configurada. Ponha a chave real no
      # .env quando quiser que o bot responda.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dummy-local}
      # Sem default: telefone admin e dado real de cada ambiente. Vazio = sem admin global
      # (cadastre os admins pelo painel em Configuracoes).
      ADMIN_PHONES: ${ADMIN_PHONES:-}

      # Defaults de DEV (o docker-compose.prod.yml os torna obrigatorios e recusa estes valores).
      RAZOR_JWT_SECRET: ${RAZOR_JWT_SECRET:-dev-jwt-secret-local-troque-em-producao-0123456789}
      ONBOARDING_API_KEY: ${ONBOARDING_API_KEY:-dev-onboarding-key}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-dev-webhook-token}

      # Console da plataforma (V51), em /plataforma no painel. Sem RAZOR_SECRETS_KEY fica desligado.
      # Gerar a chave: openssl rand -base64 32. O admin e criado no primeiro boot (senha 12+);
      # o 2FA (app autenticador) e configurado no primeiro login.
      RAZOR_SECRETS_KEY: ${RAZOR_SECRETS_KEY:-}
      RAZOR_PLATFORM_ADMIN_EMAIL: ${RAZOR_PLATFORM_ADMIN_EMAIL:-}
      RAZOR_PLATFORM_ADMIN_PASSWORD: ${RAZOR_PLATFORM_ADMIN_PASSWORD:-}

      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-barberbot}
      EVOLUTION_BASE_URL: http://evolution-api:8080

      # O painel chega pelo nginx (mesma origem), entao o CORS so importa para o `npm run dev`
      # rodando fora do Docker em 5173.
      RAZOR_CORS_ORIGINS: ${RAZOR_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # O painel local roda em http puro (localhost:3000). Chrome/Firefox aceitam cookie Secure
      # em localhost, o Safari nao — por isso false aqui. Em producao (HTTPS) use true.
      RAZOR_COOKIE_SECURE: ${RAZOR_COOKIE_SECURE:-false}
      # Piloto: com valor, o cadastro so aceita o link de convite (/cadastro?convite=...).
      RAZOR_SIGNUP_INVITE: ${RAZOR_SIGNUP_INVITE:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # O Flyway roda 30 migracoes no primeiro boot; sem esse respiro o container seria dado
      # como doente antes de terminar.
      start_period: 60s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Volta para a landing a partir do login. Build arg, nao variavel de ambiente: o
        # Vite congela import.meta.env no bundle durante o build.
        VITE_SITE_URL: ${RAZOR_SITE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      # service_started basta: o nginx resolve o backend por DNS a cada requisicao, entao ele
      # pode subir antes da API estar pronta sem quebrar.
      backend:
        condition: service_started

  site:
    # Landing institucional (razor.com.br). Estatica e independente: nao fala com a API e
    # nao depende do backend para subir — se a API cair, o site continua no ar.
    build:
      context: ./site
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Para onde vao o botao "Entrar" e os CTAs dos planos. Precisa ser um endereco que o
      # NAVEGADOR alcance, nao um nome de servico do compose: o clique acontece na maquina
      # do visitante, fora da rede do Docker.
      RAZOR_PANEL_URL: ${RAZOR_PANEL_URL:-http://localhost:3000}
    ports:
      - "${SITE_PORT:-8000}:80"

  evolution-api:
    # Fora do `up` padrao. Suba com: docker compose --profile bot up -d
    profiles: ["bot"]
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_URL: http://localhost:8080
      PORT: 8080

      # Mesmo Postgres do Razor, em schema separado.
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER:-barberbot_user}:${POSTGRES_PASSWORD:-barberbot_pass}@postgres:5432/${POSTGRES_DB:-barberbot_db}?schema=evolution"

      CONFIG_SESSION_PHONE_CLIENT: "Evolution API"
      CONFIG_SESSION_PHONE_NAME: "BarberBot"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-barberbot}
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      # O webhook do Razor e fail-closed: sem o token na URL ele recusa tudo que chega.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: "http://backend:8081/api/webhook?token=${WEBHOOK_TOKEN:-dev-webhook-token}"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      # Manda a midia ja em base64, o backend nao precisa buscar o arquivo depois.
      WEBHOOK_GLOBAL_BASE64: "true"

      # So os eventos que o bot usa — o resto so gera ruido e trava a fila.
      WEBHOOK_EVENTS_APPLICATION_STARTUP: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
    ports:
      # A Evolution expoe uma API de administracao (cria/derruba sessoes de WhatsApp): so local.
      - "127.0.0.1:${EVOLUTION_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Sessao do WhatsApp em disco: sem isso o QR Code cai a cada restart.
      - ./evolution_store:/evolution/store

volumes:
  pgdata:
