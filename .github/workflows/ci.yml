name: CI

on:
  push:
    branches: [ master, "feat/**", "fix/**" ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, test e cobertura
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publica relatorio de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  deploy:
    # Atualiza o piloto na AWS depois que os testes passam no master (docs/PILOTO-AWS.md).
    # Entra na AWS por OIDC: papel razor-github-deploy, so este repositorio e so o master.
    name: Deploy no piloto (AWS)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy-piloto
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credenciais da AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Servidor ligado?
        id: state
        run: |
          S=$(aws ec2 describe-instances --instance-ids "${{ secrets.RAZOR_INSTANCE_ID }}" \
                --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "estado=$S" >> "$GITHUB_OUTPUT"
          if [ "$S" != "running" ]; then
            echo "::warning::Servidor do piloto esta '$S': atualizacao pulada (entra no proximo push com ele ligado)."
          fi

      - name: Envia o pacote
        if: steps.state.outputs.estado == 'running'
        run: |
          git archive --format=tar.gz -o razor.tgz "$GITHUB_SHA"
          aws s3 cp razor.tgz "s3://${{ secrets.RAZOR_DEPLOY_BUCKET }}/deploy/razor-${GITHUB_SHA}.tgz" --only-show-errors

      - name: Atualiza o servidor
        if: steps.state.outputs.estado == 'running'
        run: |
          B="${{ secrets.RAZOR_DEPLOY_BUCKET }}"
          CMD="set -e; aws s3 cp s3://$B/deploy/razor-${GITHUB_SHA}.tgz /tmp/pkg.tgz --only-show-errors; \
               mkdir -p /tmp/pkg && tar -xzf /tmp/pkg.tgz -C /tmp/pkg deploy/server-deploy.sh; \
               bash /tmp/pkg/deploy/server-deploy.sh $B ${GITHUB_SHA}; rm -rf /tmp/pkg /tmp/pkg.tgz"
          ID=$(aws ssm send-command --instance-ids "${{ secrets.RAZOR_INSTANCE_ID }}" \
                --document-name AWS-RunShellScript --timeout-seconds 60 \
                --parameters "$(jq -n --arg c "$CMD" '{commands:[$c], executionTimeout:["1500"]}')" \
                --query Command.CommandId --output text)
          for i in $(seq 1 180); do
            sleep 10
            ST=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "${{ secrets.RAZOR_INSTANCE_ID }}" \
                   --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|TimedOut|Cancelled) break;; esac
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "${{ secrets.RAZOR_INSTANCE_ID }}" \
            --query StandardOutputContent --output text
          echo "Status: $ST"
          [ "$ST" = "Success" ]
