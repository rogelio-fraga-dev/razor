# Nginx da landing institucional (razor.com.br).
#
# So estatico: a landing nao fala com a API. O caminho ate o painel e um link comum,
# montado em runtime a partir de RAZOR_PANEL_URL — ver docker-entrypoint.d/10-panel-url.sh.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # config.js e reescrito a cada boot: cachear faria o navegador guardar o endereco do
    # painel de um ambiente e usar em outro.
    location = /config.js {
        include /etc/nginx/snippets/razor-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/razor-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # CSS/JS/SVG da landing nao tem hash no nome, entao cache curto: um deploy novo chega
    # no visitante em minutos, nao em dias.
    location / {
        include /etc/nginx/snippets/razor-security-headers.conf;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=600" always;
    }
}
