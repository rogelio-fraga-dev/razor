# Cabecalhos de seguranca da landing, equivalentes aos que o backend aplica (SecurityConfig).
#
# Vive num arquivo a parte e e incluido em CADA `location` de proposito: no nginx, um bloco que
# declara qualquer `add_header` proprio descarta todos os herdados do nivel de cima. Como todos
# os locations aqui definem Cache-Control, deixar estes cabecalhos so no `server` fazia eles
# sumirem silenciosamente da resposta — foi exatamente o que aconteceu na primeira versao.
#
# HSTS fica de fora: so faz sentido atras de HTTPS, e o stack local e HTTP.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP fechada. As excecoes sao o Google Fonts, que a landing carrega por <link>: a folha vem de
# fonts.googleapis.com e os .woff2 de fonts.gstatic.com. 'unsafe-inline' em style-src cobre os
# style="--a:0deg" dos satelites da orbita — sao atributos de estilo, nao script.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
