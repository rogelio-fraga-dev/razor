# Cabecalhos da previa ao vivo do editor do site (/site-previa) — iguais aos do painel
# (security-headers.conf), com UMA diferenca: pode ser enquadrada, mas so pela propria origem.
#
# O editor mostra o rascunho do site num iframe desta rota. Com o DENY/'none' do painel o
# navegador recusaria o iframe; liberar 'self' (e nao '*') mantem a protecao contra
# clickjacking: nenhum site de fora consegue enquadrar a previa.
#
# Mantenha a CSP em sincronia com security-headers.conf.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
