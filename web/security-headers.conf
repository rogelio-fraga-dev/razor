# Cabecalhos de seguranca do painel (mesmo padrao do site/security-headers.conf).
#
# Incluido em CADA `location`: no nginx, um bloco com `add_header` proprio descarta os herdados
# do `server`, e /assets/ e / definem Cache-Control — sem o include os cabecalhos sumiriam.
#
# HSTS fica de fora: so faz sentido atras de HTTPS, e o stack local e HTTP.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP do painel. script-src 'self': o bundle do Vite e um <script type=module> externo, sem
# inline. style-src precisa de 'unsafe-inline' porque o React aplica style={{...}} em varios
# componentes; mais o Google Fonts (folha em fonts.googleapis.com, .woff2 em fonts.gstatic.com).
# img-src aceita https: porque o editor do site mostra logo/hero/galeria hospedados fora, e data:
# cobre o QR Code do WhatsApp (base64). connect-src 'self': a API e mesma origem via /api.
# frame-src: 'self' para a previa ao vivo do editor (iframe de /site-previa) e o Google Maps do
# mapa embutido da secao "Onde estamos" do site publico (/b/:slug).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src 'self' https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
