# Nginx do painel: serve o build do Vite e encaminha /api para o backend.

# Webhook da Evolution fora do access log: o token vai na query string (?token=...) porque o
# webhook GLOBAL da Evolution (WEBHOOK_GLOBAL_URL) so aceita uma URL, sem headers proprios.
# Logar a linha da requisicao gravaria o segredo em texto puro. (No compose a Evolution fala
# direto com backend:8081 e nem passa por aqui; isto cobre quem apontar o webhook para o
# dominio publico.)
map $uri $razor_loggable {
    ~^/api/webhook  0;
    default         1;
}

server {
    listen 80;
    server_name _;

    # DNS interno do Docker. Sem isso o nginx resolveria "backend" uma unica vez no boot e
    # falharia de vez se o container do backend subisse depois ou fosse recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Nome do upstream numa variavel para que a resolucao acima realmente seja usada.
    set $razor_api http://backend:8081;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log main if=$razor_loggable;

    # A API vem antes da regra da SPA: /api nunca pode cair no index.html.
    location /api/ {
        include /etc/nginx/snippets/razor-security-headers.conf;
        proxy_pass $razor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP do cliente = quem abriu a conexao com o nginx. NAO usar $proxy_add_x_forwarded_for:
        # ele preserva o X-Forwarded-For que o cliente mandou, e o backend contaria o IP falso
        # nos freios de login e de API (um IP inventado por tentativa = nunca bloqueado).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O bot manda audio e imagem em base64 pelo webhook; o padrao de 1M corta.
        client_max_body_size 25m;

        # Chamadas da IA passam do minuto quando o modelo demora a responder.
        proxy_read_timeout 120s;
    }

    # Os assets do Vite tem hash no nome, entao podem ser cacheados para sempre.
    location /assets/ {
        include /etc/nginx/snippets/razor-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA. O service worker NUNCA pode ser cacheado pelo navegador (senao um deploy novo fica
    # preso atras do SW antigo) e o manifest precisa do content-type proprio para o Chrome.
    location = /sw.js {
        include /etc/nginx/snippets/razor-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/razor-security-headers.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Previa ao vivo do editor do site (V45): a UNICA rota que pode ser enquadrada, e so pela
    # propria origem (o iframe do editor). O resto do painel continua com frame-ancestors 'none'
    # contra clickjacking. Mesmo index.html da SPA; o React Router resolve /site-previa.
    location = /site-previa {
        include /etc/nginx/snippets/razor-security-headers-frameable.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # SPA: rota que nao existe no disco devolve o index.html e o React Router resolve.
    # O index.html nunca e cacheado, senao um deploy novo nao chega no navegador.
    location / {
        include /etc/nginx/snippets/razor-security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
