spring:
  application:
    name: razor

  datasource:
    url: jdbc:postgresql://localhost:5432/barberbot_db
    username: barberbot_user
    password: barberbot_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Conexao Redis — usada apenas quando razor.state.store=redis. Com store=memory (padrao),
  # os beans do Redis ficam ociosos e nao abrem conexao.
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"

server:
  port: 8081
  # IP real do cliente atras do nginx do painel: o Tomcat (RemoteIpValve) so aceita o
  # X-Forwarded-For/-Proto vindo de proxy confiavel — por padrao redes privadas e loopback, onde
  # o nginx fica no compose. Atras de um load balancer com IP publico, ajuste a regex em
  # SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES. Quem fala direto com a API nao forja o IP.
  forward-headers-strategy: native

management:
  health:
    # O starter do Redis esta no classpath so pelo adaptador de StateStore opcional. Com
    # store=memory (padrao) nao ha Redis, entao o health check dele ficaria DOWN a toa —
    # desligado por padrao. Ligue (REDIS_HEALTH=true) ao rodar com razor.state.store=redis.
    redis:
      enabled: "${REDIS_HEALTH:false}"

# Configurações do Razor (SaaS de barbearias)
razor:
  # Onde vive o estado efemero da conversa (dedup de mensagem, pausa de cliente, passo da
  # conversa). "memory" (padrao) = uma instancia, estado perdido no restart. "redis" =
  # compartilhado entre instancias e sobrevive ao restart (exige Redis; ver spring.data.redis).
  state:
    store: "${RAZOR_STATE_STORE:memory}"
  admin:
    # Telefones admin do tenant PADRAO enquanto ele nao tiver admins cadastrados no painel.
    # Nunca vale para outras barbearias (ver TenantAdminService). Vazio = nenhum.
    phones: "${ADMIN_PHONES:}"
  evolution:
    # Fora do Docker a Evolution atende em localhost:8080; dentro do compose o nome do servico
    # e evolution-api, por isso o endereco e configuravel.
    base-url: "${EVOLUTION_BASE_URL:http://localhost:8080}"
    instance-name: "BarberBotOficial"
    api-key: "${EVOLUTION_API_KEY:barberbot}"
  onboarding:
    # Vazio por padrão = onboarding desabilitado (fail-closed). Defina ONBOARDING_API_KEY
    # no ambiente para habilitar o provisionamento de novas barbearias.
    api-key: "${ONBOARDING_API_KEY:}"
  webhook:
    # Segredo que a Evolution deve enviar no webhook (header X-Webhook-Token ou ?token=...).
    # Vazio = webhook DESABILITADO (fail-closed): sem ele, qualquer um poderia forjar uma
    # mensagem com o telefone de um admin e executar comandos de gestão.
    token: "${WEBHOOK_TOKEN:}"
  security:
    # Segredo dos JWT do painel web. Vazio = chave aleatória no boot (dev). Em produção defina
    # RAZOR_JWT_SECRET com uma string longa e secreta (>= 32 caracteres).
    jwt-secret: "${RAZOR_JWT_SECRET:}"
    # Trava de producao (opt-in): com true (ou profile "prod") o boot falha se algum segredo
    # estiver vazio, curto ou com cara de exemplo (TROCAR_, dev-, barberbot...). Desligado em dev
    # para os defaults locais continuarem funcionando. Ver StrictSecretsValidator.
    strict-secrets: "${RAZOR_STRICT_SECRETS:false}"
    jwt-expiration-minutes: 720
    # O JWT do painel vai num cookie HttpOnly (nunca no localStorage). Secure=true e o padrao;
    # so desligue para dev em http fora de localhost (ex.: Safari, IP da rede local).
    cookie-secure: "${RAZOR_COOKIE_SECURE:true}"
    cors-allowed-origins: "${RAZOR_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}"
    rate-limit:
      # Freio por IP em /api/admin/** e no webhook (o login tem freio próprio, por falhas).
      # Os limites são folgados: barram varredura e laço de abuso sem atrapalhar uso real.
      enabled: "${RAZOR_RATE_LIMIT_ENABLED:true}"
      window-seconds: 60
      admin-per-minute: "${RAZOR_RATE_LIMIT_ADMIN:240}"
      webhook-per-minute: "${RAZOR_RATE_LIMIT_WEBHOOK:600}"
      # Rotas públicas do site (/api/site/**) e o POST de agendamento online, que tem teto
      # próprio por IP na janela de 1h (anti-abuso: ninguém marca 10 cortes numa hora).
      site-per-minute: "${RAZOR_RATE_LIMIT_SITE:120}"
      booking-per-window: "${RAZOR_RATE_LIMIT_BOOKING:10}"
      booking-window-seconds: 3600
  openai:
    api-key: "${OPENAI_API_KEY}"
    model: "gpt-4o"
    vision-model: "gpt-4o"
    whisper-model: "whisper-1"
    temperature: 0.7
  schedule:
    delay-minutes: 60
    batch-size: 1
    delay-between-messages: 60000

