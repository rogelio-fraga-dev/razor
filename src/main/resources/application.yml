spring:
  application:
    name: razor

  datasource:
    url: jdbc:postgresql://localhost:5432/barberbot_db
    username: barberbot_user
    password: barberbot_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Pool dos @Scheduled. Com 1 thread (padrao do Boot), o motor de tarefas travado travaria
  # tambem o monitor de saude (V50) que deveria denuncia-lo, e os relatorios das 08h/21h.
  task:
    scheduling:
      pool:
        size: "${RAZOR_SCHEDULER_THREADS:3}"

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Cada parte do piloto tem numero de migracao reservado (docs/MVP-PILOTO.md) e elas entram
    # na ordem em que ficam prontas: a V47 (automacoes) chega depois da V49 ja aplicada.
    out-of-order: true

  # Conexao Redis — usada apenas quando razor.state.store=redis. Com store=memory (padrao),
  # os beans do Redis ficam ociosos e nao abrem conexao.
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"

server:
  port: 8081
  # IP real do cliente atras do nginx do painel: o Tomcat (RemoteIpValve) so aceita o
  # X-Forwarded-For/-Proto vindo de proxy confiavel — por padrao redes privadas e loopback, onde
  # o nginx fica no compose. Atras de um load balancer com IP publico, ajuste a regex em
  # SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES. Quem fala direto com a API nao forja o IP.
  forward-headers-strategy: native

management:
  # So o health fica exposto na web (o padrao do Boot, explicito para ninguem ligar env/beans
  # por engano). Detalhes desligados por padrao: o compose so precisa do status. Com
  # RAZOR_HEALTH_DETAILS=always aparecem os detalhes de db, disco e o componente "razor" (V50: incidentes
  # abertos por tipo, batimento do motor de tarefas, storage das fotos) — nada de segredo.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: "${RAZOR_HEALTH_DETAILS:never}"
      show-components: "${RAZOR_HEALTH_COMPONENTS:always}"
  health:
    # O starter do Redis esta no classpath so pelo adaptador de StateStore opcional. Com
    # store=memory (padrao) nao ha Redis, entao o health check dele ficaria DOWN a toa —
    # desligado por padrao. Ligue (REDIS_HEALTH=true) ao rodar com razor.state.store=redis.
    redis:
      enabled: "${REDIS_HEALTH:false}"

# Configurações do Razor (SaaS de barbearias)
razor:
  # Onde vive o estado efemero da conversa (dedup de mensagem, pausa de cliente, passo da
  # conversa). "memory" (padrao) = uma instancia, estado perdido no restart. "redis" =
  # compartilhado entre instancias e sobrevive ao restart (exige Redis; ver spring.data.redis).
  state:
    store: "${RAZOR_STATE_STORE:memory}"
  admin:
    # Telefones admin do tenant PADRAO enquanto ele nao tiver admins cadastrados no painel.
    # Nunca vale para outras barbearias (ver TenantAdminService). Vazio = nenhum.
    phones: "${ADMIN_PHONES:}"
  evolution:
    # Fora do Docker a Evolution atende em localhost:8080; dentro do compose o nome do servico
    # e evolution-api, por isso o endereco e configuravel.
    base-url: "${EVOLUTION_BASE_URL:http://localhost:8080}"
    instance-name: "BarberBotOficial"
    api-key: "${EVOLUTION_API_KEY:barberbot}"
  # Monitoramento de saude por barbearia (V50): WhatsApp desconectado, IA falhando, envios
  # falhando, fila parada, motor de tarefas parado. Vira incidente no painel (Configuracoes →
  # Status e banner) e, quando o canal funciona, aviso no WhatsApp do dono com intervalo minimo.
  # O aviso ao OPERADOR da plataforma e opt-in: webhook (Slack/Discord/JSON) e/ou linha de log.
  monitoring:
    enabled: "${RAZOR_MONITORING_ENABLED:true}"
    interval-ms: "${RAZOR_MONITORING_INTERVAL_MS:120000}"
    owner-cooldown-hours: "${RAZOR_MONITORING_OWNER_COOLDOWN_HOURS:6}"
    operator-cooldown-minutes: "${RAZOR_MONITORING_OPERATOR_COOLDOWN_MINUTES:60}"
    operator-webhook-url: "${RAZOR_OPERATOR_WEBHOOK_URL:}"
    operator-log-alerts: "${RAZOR_OPERATOR_LOG_ALERTS:false}"
  # Onde ficam as fotos do site (V50): "db" (padrao, no Postgres) ou "s3" (bucket S3 compativel:
  # AWS, MinIO, R2). A URL publica /api/site/img/{uuid} nao muda: o backend le do bucket
  # (privado) e responde. Credenciais vazias = cadeia padrao da AWS (AWS_*, perfil, IAM role).
  storage:
    type: "${RAZOR_STORAGE_TYPE:db}"
    s3:
      bucket: "${RAZOR_S3_BUCKET:}"
      region: "${RAZOR_S3_REGION:us-east-1}"
      endpoint: "${RAZOR_S3_ENDPOINT:}"
      prefix: "${RAZOR_S3_PREFIX:site-images/}"
      access-key: "${RAZOR_S3_ACCESS_KEY:}"
      secret-key: "${RAZOR_S3_SECRET_KEY:}"
      path-style: "${RAZOR_S3_PATH_STYLE:false}"
  onboarding:
    # Vazio por padrão = onboarding desabilitado (fail-closed). Defina ONBOARDING_API_KEY
    # no ambiente para habilitar o provisionamento de novas barbearias.
    api-key: "${ONBOARDING_API_KEY:}"
  signup:
    # Cadastro sozinho pela landing (V49): cria barbearia + dono em TRIAL. O teste e so
    # informativo (banner no painel) enquanto a cobranca nao existe.
    enabled: "${RAZOR_SIGNUP_ENABLED:true}"
    trial-days: "${RAZOR_TRIAL_DAYS:14}"
  webhook:
    # Segredo que a Evolution deve enviar no webhook (header X-Webhook-Token ou ?token=...).
    # Vazio = webhook DESABILITADO (fail-closed): sem ele, qualquer um poderia forjar uma
    # mensagem com o telefone de um admin e executar comandos de gestão.
    token: "${WEBHOOK_TOKEN:}"
  security:
    # Segredo dos JWT do painel web. Vazio = chave aleatória no boot (dev). Em produção defina
    # RAZOR_JWT_SECRET com uma string longa e secreta (>= 32 caracteres).
    jwt-secret: "${RAZOR_JWT_SECRET:}"
    # Trava de producao (opt-in): com true (ou profile "prod") o boot falha se algum segredo
    # estiver vazio, curto ou com cara de exemplo (TROCAR_, dev-, barberbot...). Desligado em dev
    # para os defaults locais continuarem funcionando. Ver StrictSecretsValidator.
    strict-secrets: "${RAZOR_STRICT_SECRETS:false}"
    jwt-expiration-minutes: 720
    # O JWT do painel vai num cookie HttpOnly (nunca no localStorage). Secure=true e o padrao;
    # so desligue para dev em http fora de localhost (ex.: Safari, IP da rede local).
    cookie-secure: "${RAZOR_COOKIE_SECURE:true}"
    cors-allowed-origins: "${RAZOR_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}"
    rate-limit:
      # Freio por IP em /api/admin/** e no webhook (o login tem freio próprio, por falhas).
      # Os limites são folgados: barram varredura e laço de abuso sem atrapalhar uso real.
      enabled: "${RAZOR_RATE_LIMIT_ENABLED:true}"
      window-seconds: 60
      admin-per-minute: "${RAZOR_RATE_LIMIT_ADMIN:240}"
      webhook-per-minute: "${RAZOR_RATE_LIMIT_WEBHOOK:600}"
      # Rotas públicas do site (/api/site/**) e o POST de agendamento online, que tem teto
      # próprio por IP na janela de 1h (anti-abuso: ninguém marca 10 cortes numa hora).
      site-per-minute: "${RAZOR_RATE_LIMIT_SITE:120}"
      booking-per-window: "${RAZOR_RATE_LIMIT_BOOKING:10}"
      booking-window-seconds: 3600
      # Cadastro de barbearia pela landing (POST /api/signup): teto por IP na janela de 1h.
      signup-per-window: "${RAZOR_RATE_LIMIT_SIGNUP:10}"
      signup-window-seconds: 3600
  # Console da plataforma (V51). Sem RAZOR_SECRETS_KEY o console fica desligado (503): a chave da
  # OpenAI e o segredo do 2FA sao guardados cifrados com ela. Gerar: openssl rand -base64 32
  platform:
    secrets-key: "${RAZOR_SECRETS_KEY:}"
    admin-email: "${RAZOR_PLATFORM_ADMIN_EMAIL:}"
    admin-password: "${RAZOR_PLATFORM_ADMIN_PASSWORD:}"
    usd-to-brl: "${RAZOR_USD_TO_BRL:5.40}"
  openai:
    api-key: "${OPENAI_API_KEY}"
    # Chat: gpt-4o-mini por padrao (rapido e barato); o gpt-4o so entra quando o mini falha ou
    # devolve uma tag de agendamento quebrada (escalation-model).
    model: "${OPENAI_MODEL:gpt-4o-mini}"
    escalation-model: "${OPENAI_ESCALATION_MODEL:gpt-4o}"
    vision-model: "gpt-4o"
    # Transcricao: gpt-4o-mini-transcribe (mais rapido); whisper-1 de reserva se ele falhar.
    whisper-model: "${OPENAI_TRANSCRIBE_MODEL:gpt-4o-mini-transcribe}"
    whisper-fallback-model: "whisper-1"
    temperature: 0.7
  schedule:
    delay-minutes: 60
    batch-size: 1
    delay-between-messages: 60000

  # Dados Completos da Barbearia Ficticia Figaro
